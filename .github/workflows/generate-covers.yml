name: Generate illustrated school covers
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Render all catalog covers
        run: python library-import/generate_covers.py
      - name: Commit cover images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers/catalog
          if ! git diff --cached --quiet; then
            git commit -m "Publish illustrated subject-specific school book covers"
            git push
          fi
