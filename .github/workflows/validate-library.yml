name: Audit educational library links
on:
  push:
    branches: [main]
    paths: ['*.html', '*.js', '*.xml', '*.css', 'tests/**', 'library-import/**', '.github/workflows/validate-library.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/grade_video_links.py
      - run: python tests/site_integrity.py
      - run: python tests/site_navigation.py
      - run: node --check site-paths.js
      - run: python tests/lesson_media_integrity.py
      - run: node --check study-slides.js
      - run: node --check curriculum-player.js
      - run: node --check grade-three-videos.js
      - run: python library-import/validate_catalog.py --offline
      - if: github.event_name != 'push'
        run: python library-import/validate_catalog.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'push'
        with:
          name: taha-android-library-audit
          path: library-import/audit-report.json
          retention-days: 30
